---
drbd_install_packages:
  - "{{ _drbd_module_package }}"
 # - drbd-ueficert # not in public proxmox repo
  - drbd-utils
  - "{{ _drbd_install_proxy }}"

_drbd_module_package: "{{ 'drbd-dkms' if _drbd_install_dkms else 'drbd-module-' ~ ansible_facts['kernel'] }}"
_drbd_install_drbdadm_path: /usr/sbin/drbdadm

# Installed packages of the other build method, removed after the selected package installs
_drbd_install_replaced_packages: >-
  {{ ansible_facts['packages'] | default({}) | list
     | select('match', '^drbd-module-[0-9]' if _drbd_install_dkms else '^drbd-dkms$')
     | list }}
