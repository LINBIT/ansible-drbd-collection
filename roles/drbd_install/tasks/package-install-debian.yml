---
- name: Install DRBD packages (APT)
  ansible.builtin.apt:
    name: "{{ (drbd_install_prereqs + drbd_install_packages) | reject('falsy') | list }}"
    state: "{{ drbd_install_package_state }}"
    allow_downgrade: true
  environment:
    SPAAS: "{{ drbd_install_spaas | bool | string | lower }}"
  register: _drbd_install_packages_result
  until: _drbd_install_packages_result is succeeded
  retries: 3
  notify: restart_multipathd

- name: Remove the DRBD module packages of the other build path (APT)
  ansible.builtin.apt:
    name: "{{ _drbd_install_replaced_packages }}"
    state: absent
    # An earlier version pin holds the package of the other build path
    allow_change_held_packages: true
  when: _drbd_install_replaced_packages | length > 0
