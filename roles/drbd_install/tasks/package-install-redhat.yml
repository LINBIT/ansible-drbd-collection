---
- name: Install DRBD packages (DNF)
  ansible.builtin.dnf:
    name: "{{ (drbd_install_prereqs + drbd_install_packages) | reject('falsy') | list }}"
    state: "{{ drbd_install_package_state }}"
    nobest: true
    allow_downgrade: true
  environment:
    SPAAS: "{{ drbd_install_spaas | bool | string | lower }}"
  register: _drbd_install_packages_result
  until: _drbd_install_packages_result is succeeded
  retries: 3
