---
- name: Install EPEL release package (for DKMS)
  ansible.builtin.dnf:
    name: "{{ drbd_install_epel_package }}"
    state: present
  register: _drbd_install_epel
  until: _drbd_install_epel is succeeded
  retries: 3

- name: Enable CRB/PowerTools repo (DKMS build deps)
  ansible.builtin.command:
    cmd: "dnf config-manager --set-enabled {{ drbd_install_crb_repo }}"
  changed_when: false

# The drbd-dkms RPM does not require perl (yet), explicitly add it now
- name: Install kernel headers and perl for DKMS (DNF)
  ansible.builtin.dnf:
    name: "{{ (ansible_facts | linbit.common.dkms_kernel_headers) + ['perl-interpreter'] }}"
    state: present
    nobest: true
    allow_downgrade: true
  register: _drbd_install_kernel_headers
  until: _drbd_install_kernel_headers is succeeded
  retries: 3
