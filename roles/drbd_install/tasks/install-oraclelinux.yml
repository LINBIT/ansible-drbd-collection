---
# lru_cache.ko for the running kernel - unversioned resolves to the newest kernel
- name: Queue prerequisite packages (Oracle Linux UEK)
  ansible.builtin.set_fact:
    drbd_install_prereqs: "{{ drbd_install_prereqs + ['kernel-uek-modules-' ~ ansible_facts['kernel']] }}"
  when: ansible_facts | linbit.common.is_uek
