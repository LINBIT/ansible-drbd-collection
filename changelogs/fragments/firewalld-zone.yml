---
minor_changes:
  - >-
    drbd_install - add a ``drbd_install_firewalld_zone`` variable to choose the
    firewalld zone the DRBD replication ports are opened in. Empty, the default,
    omits the zone argument and firewalld uses the default zone, so behaviour is
    unchanged unless the variable is set. Set it when a zone is bound to a
    source, because firewalld matches a source before an interface and zone
    drifting was removed in firewalld 1.0, so a port opened in the default zone
    does not apply to traffic matched into a source zone. Replication commonly
    runs on its own network, which is exactly the case a source-bound zone
    covers. UFW has no zones and ignores the setting
    (https://github.com/LINBIT/ansible-linstor-collection/issues/2).
